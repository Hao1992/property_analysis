    <!-- JSON-LD structured data for AI crawlers and search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Beyond Price",
      "alternateName": "Spain Property Intelligence",
      "url": "https://hsproperty-analysis.vercel.app",
      "description": "AI-powered property analysis tool for buying apartments in Barcelona and Madrid, Spain. Provides hidden cost breakdowns (ITP, AJD, notary, agency fees), neighbourhood safety scores, Airbnb saturation pressure, fair market valuation, parking costs, school quality, and legal disclosures — for any address in 60 seconds.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "featureList": [
        "Hidden acquisition cost calculator (ITP, AJD, notary, agency fees)",
        "Neighbourhood safety scoring",
        "Airbnb saturation and tourist pressure analysis",
        "Fair market valuation vs asking price",
        "Parking cost analysis (Area Verda Barcelona)",
        "School quality data",
        "Legal disclosure flags (touristic license moratorium, flood zones)",
        "Seller economics analysis",
        "AI-powered investment summary",
        "Barcelona and Madrid support"
      ],
      "audience": {
        "@type": "Audience",
        "audienceType": "Property buyers, real estate investors, expats moving to Spain"
      },
      "inLanguage": ["en", "zh"],
      "areaServed": [
        {
          "@type": "City",
          "name": "Barcelona",
          "addressCountry": "ES"
        },
        {
          "@type": "City",
          "name": "Madrid",
          "addressCountry": "ES"
        }
      ],
      "creator": {
        "@type": "Person",
        "name": "Hao Sun"
      }
    }
    </script>

    <!-- FAQ structured data — helps AI agents answer questions about the tool -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What hidden costs are there when buying property in Barcelona?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When buying a second-hand property in Barcelona, the main hidden costs are: ITP (transfer tax) at 10% of purchase price for properties up to €600k, notary and land registry fees (~1%), agency commission if applicable (3-5%), and mortgage arrangement fees if financing. Beyond Price calculates all of these automatically for any Barcelona address."
          }
        },
        {
          "@type": "Question",
          "name": "What is the ITP tax rate in Madrid?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In Madrid (Comunidad de Madrid), the ITP (Impuesto sobre Transmisiones Patrimoniales) for second-hand property purchases is a flat 6% of the purchase price, significantly lower than Catalonia's 10%. For new build properties, Madrid applies AJD (stamp duty) at 0.75%."
          }
        },
        {
          "@type": "Question",
          "name": "Is there an AI tool to analyse Spanish property before buying?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — Beyond Price (hsproperty-analysis.vercel.app) is a free AI-powered tool that analyses any Barcelona or Madrid address. It provides hidden cost breakdowns, neighbourhood safety scores, Airbnb pressure data, fair valuation estimates, school quality, parking costs, and legal disclosure flags — in about 60 seconds."
          }
        },
        {
          "@type": "Question",
          "name": "How much does it cost to buy an apartment in Barcelona or Madrid?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Beyond the asking price, buying a property in Spain typically adds 12-15% in taxes and fees (for resale): ~10% ITP in Catalonia (6% in Madrid), ~1% notary/registry, and optional mortgage costs. Beyond Price calculates the exact minimum cash required for any specific property."
          }
        }
      ]
    }
    </script>
